<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Planner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script> <!-- Markdown Parser -->

    <style>
        body {
            background: linear-gradient(135deg, #ff9a9e, #fad0c4); /* Change as needed */
            min-height: 100vh;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body class="bg-light">

<div class="container mt-5">
    <h2 class="text-center mb-4">Travel Planner</h2>

    <!-- Add New Location Button -->
    <div class="text-center mb-3">
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addLocationModal">Add New Location</button>
    </div>

    <!-- Modal for Adding Location -->
    <div class="modal fade" id="addLocationModal" tabindex="-1" aria-labelledby="addLocationModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="addLocationModalLabel">Add Location</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="locationForm">
                        <div class="mb-3">
                            <label for="locationName" class="form-label">Location Name (City, State(optional), Country)</label>
                            <input type="text" class="form-control" id="locationName" placeholder="Enter location">
                        </div>
                        <div class="mb-3">
                            <label for="locationDate" class="form-label">Date & Time</label>
                            <input type="datetime-local" class="form-control" id="locationDate">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Save Location</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Previously Added Locations -->
    <div class="card">
        <div class="card-header">
            <h5>Itinerary</h5>
        </div>
        <ul class="list-group list-group-flush" id="locationList">
            <!-- Sample locations -->
            <li class="list-group-item">
                <a href="#" class="view-location" data-location="New York, NY, US" data-date="2025-05-10 14:30">New York, NY, US - May 10, 2025</a>
            </li>
            <li class="list-group-item">
                <a href="#" class="view-location" data-location="Tokyo, Japan" data-date="2025-03-22 09:00">Tokyo, Japan - March 22, 2025</a>
            </li>
        </ul>
    </div>

    <!-- Display Selected Location Details -->
    <div class="mt-4">
        <h4>Selected Location</h4>
        <p><strong>Location:</strong> <span id="selectedLocation">None</span></p>
        <p><strong>Date & Time:</strong> <span id="selectedDate">N/A</span></p>
    </div>
    <div class="border p-3 bg-white" id="itineraryOutput" style="min-height: 100px;">
        Enter your trip information above for a curated list of activities for your next vacation!
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const form = document.getElementById("locationForm");
        const locationList = document.getElementById("locationList");
        const selectedLocation = document.getElementById("selectedLocation");
        const selectedDate = document.getElementById("selectedDate");

        // Handle adding new locations
        form.addEventListener("submit", function(event) {
            event.preventDefault();
            const locationName = document.getElementById("locationName").value.trim();
            const locationDate = document.getElementById("locationDate").value;

            if (locationName && locationDate) {
                const formattedDate = new Date(locationDate).toLocaleString();

                // Create new list item
                const newItem = document.createElement("li");
                newItem.classList.add("list-group-item");
                newItem.innerHTML = `<a href="#" class="view-location" data-location="${locationName}" data-date="${formattedDate}">${locationName} - ${formattedDate}</a>`;
                
                // Append to list
                locationList.appendChild(newItem);

                // Reset form
                document.getElementById("locationName").value = "";
                document.getElementById("locationDate").value = "";

                // Close modal
                var addLocationModal = bootstrap.Modal.getInstance(document.getElementById('addLocationModal'));
                addLocationModal.hide();
            }
        });

        // Handle selecting a location
        locationList.addEventListener("click", function(event) {
            if (event.target.classList.contains("view-location")) {
                event.preventDefault();
                selectedLocation.textContent = event.target.getAttribute("data-location");
                selectedDate.textContent = event.target.getAttribute("data-date");
                generateItinerary(selectedLocation.textContent, selectedDate.textContent);
            }
        });
    });
</script>

<script>
    function generateItinerary(location_name, location_time) {
        let name = location_name;
        let time = location_time;
        let output = document.getElementById("itineraryOutput");

        if (!name.trim() || !time.trim()) {
            output.innerText = "Invalid Information. Please enter details about your trip.";
            return;
        }

        // Send the entire input as a single text block
        fetch("/get_itinerary", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                name: location_name,  // Send input as a raw text string
                time: location_time
            })
        })
        .then(response => response.json())
        .then(data => {
            // Parse Markdown and render it as HTML
            output.innerHTML = marked.parse(data.itinerary || "No itinerary found.");
        })
        .catch(error => {
            output.innerText = "An error occurred. Please try again.";
        });
    }
</script>

</body>
</html>
