<!DOCTYPE html>
<html lang='en'>
  <head>
    <title>SmartMaps</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <link rel="stylesheet" href="static/css/main.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css" />
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.17/index.global.min.js'></script>
    <script>
      function saveCalendarData(events) {
        // save to calendar object in database
        //calendar = document.getElementById('calendar');
        events = events.map(event => {
          console.log(event.start.toISOString())
          return {
            title: event.title,
            start: event.start.toISOString(),
            end: event.end ? event.end.toISOString() : null,
            allDay: event.allDay,
          };
        });
        console.log(events);
        
        fetch('/save_itinerary', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            events: events
          })
        })
        .then(response => {
          if (response.ok) {
            console.log('Calendar data saved successfully');
          } else {
            console.error('Error saving calendar data');
          }
        })
      }

      document.addEventListener('DOMContentLoaded', function() {
        var Calendar = FullCalendar.Calendar;
        var Draggable = FullCalendar.Draggable;
      
        var containerEl = document.getElementById('external-events');
        var calendarEl = document.getElementById('calendar');
        var checkbox = document.getElementById('drop-remove');
      
        // initialize the external events
        // -----------------------------------------------------------------
      
        new Draggable(containerEl, {
          itemSelector: '.fc-event',
          eventData: function(eventEl) {
            return {
              title: eventEl.innerText
            };
          }
        });
      
        // initialize the calendar
        // -----------------------------------------------------------------
      
        var calendar = new Calendar(calendarEl, {
          headerToolbar: {
            left: 'prev,next today',
            center: 'title',
            right: 'dayGridMonth,timeGridWeek,timeGridDay'
          },
          editable: true,
          droppable: true, // this allows things to be dropped onto the calendar
          drop: function(info) {
            info.draggedEl.parentNode.removeChild(info.draggedEl);
            // remove the element from datbase
            fetch('/remove_draggable', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                title: info.draggedEl.innerText
              })
            })
            .then(response => {
              if (response.ok) {
                console.log('Event removed successfully');
              } else {
                console.error('Error removing event');
              }
            })
          },
          eventReceive: function(info) {
            saveCalendarData([info.event]);
          },
        });

        fetch('/get_itinerary')
          .then(response => response.json())
          .then(data => {
            const events = data.events;
            calendar.addEventSource(events);
          })
          .catch(error => {
            console.error('Error fetching calendar data:', error);
          });

        calendar.render();
      });
    </script>
  </head>

  <body class="left-sidebar is-preload">
    <div id="page-wrapper">
  
      {% include 'navbar.html' %}
  
  
      <!-- Custom Planner UI Section -->
      <section id="main" class="wrapper style3">
        <div class="title">Itinerary</div>
          <style>
            html, body {
              margin: 0;
              padding: 0;
              font-family: Arial, Helvetica Neue, Helvetica, sans-serif;
              font-size: 12px;
            }
            
            #external-events {
              position: fixed;
              z-index: 2;
              top: 20px;
              left: 20px;
              width: 150px;
              padding: 0 10px;
              border: 1px solid #ccc;
              background: #eee;
            }
            
            #external-events .fc-event {
              cursor: move;
              margin: 3px 0;
            }
            
            #calendar-container {
              position: relative;
              z-index: 1;
              margin-left: 0px;
            }
            
            #calendar {
              max-width: 1300px;
              margin: 20px auto;
            }
          </style>
          <div id='external-events'>
            <p>
              <strong>Activities</strong>
            </p>

            {% for draggable in draggables %}
              <div class='fc-event fc-h-event fc-daygrid-event fc-daygrid-block-event'>
                <div class='fc-event-main'>{{ draggable }}</div>
              </div>
            {% endfor %}
          </div>
          
          <div id='calendar-container'>
            <div id='calendar'></div>
          </div>
      </section>
    </div>
  </body>
</html>
