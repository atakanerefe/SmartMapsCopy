<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Recipe Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script> <!-- Markdown Parser -->

    <style>
        body {
            background: linear-gradient(135deg, #ff9a9e, #fad0c4); /* Change as needed */
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow p-4">
            <h2 class="text-center mb-4">AI Recipe Generator</h2>
            <p class="text-center">Enter your available ingredients and get recipe suggestions!</p>
            
            <!-- Ingredients Input -->
            <div class="mb-3">
                <textarea class="form-control" id="inputIngredients" rows="4" 
                    placeholder="Enter ingredients separated by commas (e.g., tomato, cheese, bread)"></textarea>
            </div>

            <!-- Generate Recipes Button -->
            <div class="d-grid gap-2 mb-3">
                <button class="btn btn-primary" onclick="generateRecipes()">Get Recipes</button>
            </div>

            <!-- Display Recipes -->
            <div class="border p-3 bg-white" id="outputRecipes" style="min-height: 100px;">
                Enter ingredients above and click "Get Recipes" to see suggestions!
            </div>
        </div>
    </div>

    <script>
        function generateRecipes() {
            let input = document.getElementById("inputIngredients").value;
            let output = document.getElementById("outputRecipes");

            if (input.trim() === "") {
                output.innerText = "Please enter some ingredients.";
                return;
            }
            
            // Convert input string to a list of ingredients
            let ingredientsList = input.split(",").map(item => item.trim());

            // Use fetch to send the ingredients to the server
            fetch("/get_recipes", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    ingredients: ingredientsList
                })
            })
            .then(response => response.json())
            .then(data => {
                // Parse Markdown and render it as HTML
                output.innerHTML = marked.parse(data.recipes || "No recipes found.");
            })
            .catch(error => {
                output.innerText = "An error occurred. Please try again.";
            });
        }
    </script>
</body>
</html>
